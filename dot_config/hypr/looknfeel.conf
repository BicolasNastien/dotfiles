# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general

general {
   border_size = 2
   gaps_out = 3                                                       # no gap between window and monitor
   gaps_in = 3                                                        # gap between different windows
   col.inactive_border = rgba(89,89,89,0.05)                          # barely visible border
   col.active_border = rgba(33ccff33) rgba(00ff9933) 45deg            # quite faint  border on active window
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 8
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 0 1
}
